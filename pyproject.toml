[build-system]
requires = ["setuptools>=64.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "edgetest_toy"
version = "0.1.0"
description = "Bleeding edge dependency testing"
requires-python = ">=3.10"
dependencies = ["requests<=2.25.0"]

[project.optional-dependencies]
tests = ["pytest"]

[tool.setuptools]
packages = ["edgetest_toy"]

# Legacy table style on purpose: the conda-forge `edgetest` package the action
# installs (2026.1.0) only reads [edgetest], not [tool.edgetest].
# See https://github.com/edgetest-dev/run-edgetest-action/issues/28
[edgetest]
python_version = "3.11"
extras = ["tests"]
command = "pytest tests -m 'not integration'"

[edgetest.envs.core]
upgrade = ["requests"]
deps = ["pip-tools"]
